name: Small fix or cleanup (XS / S)
description: >
  A small fix, clean-up, configuration change, or single-file refactor that a
  developer can complete in one sitting. Uses the XS / S specification template.
labels: ["needs-triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is the problem or request?
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - bug
        - feature
        - tech debt
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - UI
        - Score
        - Canvas
        - Lily
        - Config
        - Test
        - Tooling
        - Controls
        - Docs
        - Audio
        - Other
    validations:
      required: true

  - type: dropdown
    id: difficulty
    attributes:
      label: Difficulty
      options:
        - XS
        - S
    validations:
      required: true
