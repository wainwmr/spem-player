name: Scores CI

on:
  push:
    branches: [main]
    paths:
      - "packages/scores/**"
      - ".github/workflows/scores-ci.yml"
  pull_request:
    paths:
      - "packages/scores/**"
      - ".github/workflows/scores-ci.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Restore git timestamps
        run: |
          # actions/checkout writes files with the current wall-clock time,
          # so rebuild-by-mtime caches see source files as newer than SVGs.
          # Reset the relevant files to their last commit time instead.
          git ls-files -z packages/scores/src packages/scores/build packages/pwa/src/scores |
            while IFS= read -r -d '' f; do
              mtime=$(git log -1 --format=%ct -- "$f") && touch -d "@$mtime" "$f"
            done

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - run: pnpm install
      - run: pnpm --filter @spem/scores test
      - run: bash packages/scores/build/install-lilypond.sh

      - run: |
          export PATH="$HOME/.local/lilypond/lilypond-2.26.0/bin:$PATH"
          pnpm run build:scores

      - name: Commit updated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/pwa/src/scores/
          if git diff --cached --quiet; then
            echo "No SVG changes to commit"
            exit 0
          fi
          git commit -m "chore: regenerate SVGs [skip ci]"
          git push
