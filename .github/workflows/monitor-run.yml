name: Monitor Run

on:
  schedule:
    # 02:29 UTC (02:29 GMT / 03:29 BST). Off-hour to dodge GitHub
    # top-of-hour scheduling throttling; see #454.
    - cron: "29 2 * * *"
  workflow_dispatch:

permissions:
  actions: read
  issues: write
  contents: write
  pull-requests: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.MONITOR_PUSH_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @spem/monitor

      - name: Check usage and notify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: pnpm --filter @spem/monitor exec node monitor-resources.mjs

      - name: Commit daily resource series
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/monitor-series.json
          if git diff --cached --quiet; then
            echo "No series changes to commit"
            exit 0
          fi
          git commit -m "chore: update daily resource series [skip ci]"
          git push
