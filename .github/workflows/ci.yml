name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Daily at 00:00 UTC — catches drift in the integration suite on days
  # when no build-related PR triggered the path-filtered integration job.
  # GitHub may delay scheduled runs by up to ~15 min during peak load.
  schedule:
    - cron: "0 0 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run ci

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            build-related:
              - "build/**"
              - "src/lilypond/**"
              - "src/scores/**"
              - "src/test/integration/**"
              - "package.json"
              - "package-lock.json"
              - ".github/workflows/ci.yml"

      - name: Check if integration tests should run
        id: should-run
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.filter.outputs.build-related }}" == "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - uses: actions/setup-node@v6
        if: steps.should-run.outputs.run == 'true'
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci
        if: steps.should-run.outputs.run == 'true'

      - name: Run integration tests
        run: npm run test:integration
        if: steps.should-run.outputs.run == 'true'

      - name: Report skip when no build-related changes
        if: steps.should-run.outputs.run != 'true'
        run: echo "Integration tests skipped (no build-related changes)"
