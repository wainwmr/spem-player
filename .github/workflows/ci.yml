name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Daily at 00:00 UTC — catches drift in the integration suite on days
  # when no build-related PR triggered the path-filtered integration job.
  # GitHub may delay scheduled runs by up to ~15 min during peak load.
  schedule:
    - cron: "0 0 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci

      - name: Run checks and build
        id: check-build
        run: |
          start=$(date +%s)
          npm run check && npm run build
          end=$(date +%s)
          duration=$((end - start))
          echo "duration=${duration}" >> "$GITHUB_OUTPUT"
          echo "Check + build completed in ${duration}s"

      - name: Run unit tests
        id: unit-tests
        run: |
          start=$(date +%s)
          npm run test:unit
          end=$(date +%s)
          duration=$((end - start))
          echo "duration=${duration}" >> "$GITHUB_OUTPUT"
          echo "Unit tests completed in ${duration}s (soft budget: 120s)"

      - name: Report CI duration budget
        run: |
          check_build=${{ steps.check-build.outputs.duration }}
          unit=${{ steps.unit-tests.outputs.duration }}
          total=$((check_build + unit))
          echo "Total CI duration: ${total}s (soft budget: 360s)"
          echo "Unit-test duration: ${unit}s (soft budget: 120s)"
          if [ "$unit" -gt 120 ]; then
            echo "::warning::Unit tests took ${unit}s, exceeding the 2-minute soft budget."
          fi
          if [ "$total" -gt 360 ]; then
            echo "::warning::CI suite took ${total}s, exceeding the 6-minute soft budget."
          fi

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            build-related:
              - "build/**"
              - "src/lilypond/**"
              - "src/scores/**"
              - "src/test/integration/**"
              - "package.json"
              - "package-lock.json"
              - "vite.config.ts"
              - "tsconfig.json"
              - ".nvmrc"
              - ".github/workflows/ci.yml"

      - name: Check if integration tests should run
        id: should-run
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.filter.outputs.build-related }}" == "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - uses: actions/setup-node@v6
        if: steps.should-run.outputs.run == 'true'
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci
        if: steps.should-run.outputs.run == 'true'

      - name: Run integration tests
        run: npm run test:integration
        if: steps.should-run.outputs.run == 'true'

      - name: Report skip when no build-related changes
        if: steps.should-run.outputs.run != 'true'
        run: |
          msg="Integration tests skipped — should-run='${{ steps.should-run.outputs.run }}' (PR did not touch build-related paths)."
          echo "$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
