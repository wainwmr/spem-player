name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Daily at 00:00 UTC — catches drift in the integration suite on days
  # when no build-related PR triggered the path-filtered integration job.
  # GitHub may delay scheduled runs by up to ~15 min during peak load.
  schedule:
    - cron: "0 0 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci

      # Cache the generated SVGs keyed on a hash of every input that affects
      # them (build/scoreCacheKey.mjs — the single source of truth, unit-tested
      # in src/test/scoreCacheKey.test.ts). On an exact-key hit we restore the
      # SVGs and skip the LilyPond install + regeneration entirely (~570s);
      # buildScores.mjs's --skip-if-missing canary path then carries the build
      # on the restored SVGs. There is deliberately NO restore-keys fallback: a
      # partial-key match would restore stale SVGs and ship wrong scores. (#421)
      - name: Compute score cache key
        id: scorekey
        run: |
          # Assign first so `set -e` (on by default in Actions) catches a
          # non-zero exit — a command substitution inside `echo "key=$(...)"`
          # would NOT trip set -e, silently writing an empty key. Then assert
          # the digest shape, so a script failure or empty key fails the build
          # rather than collapsing the cache key to the constant "scores-v1-"
          # and self-poisoning the cache. (#421)
          key="$(node build/scoreCacheKey.mjs)"
          if [[ ! "$key" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::scoreCacheKey.mjs produced an invalid key: '$key'" >&2
            exit 1
          fi
          echo "key=$key" >> "$GITHUB_OUTPUT"

      # actions/cache restores on an exact-key hit; it SAVES src/scores in an
      # automatic post-job step only on a key miss (and only if the job
      # succeeds). There is no explicit save step.
      - name: Restore generated SVG cache
        id: scores-cache
        uses: actions/cache@v4
        with:
          path: src/scores
          key: scores-v1-${{ steps.scorekey.outputs.key }}

      # Install LilyPond only on a cache miss. On a hit the restored SVGs are
      # used as-is. Mirrors the netlify.toml chain — same script, same explicit
      # PATH export across the `&&` boundary in the build step below (the
      # script's own export does not propagate).
      - name: Install LilyPond
        if: steps.scores-cache.outputs.cache-hit != 'true'
        run: bash build/install-lilypond.sh

      # Timed-step pattern (each phase below): capture the command's exit status
      # separately so the duration is emitted even on failure (telemetry matters
      # most when a phase regresses), then re-exit with the captured status so
      # the job's success/failure semantics are preserved. The phases are timed
      # separately (#422) so the report can break out the LilyPond render and
      # exclude it from the soft budget.
      - name: Check
        id: check
        run: |
          start=$(date +%s)
          status=0
          npm run check || status=$?
          end=$(date +%s)
          echo "duration=$((end - start))" >> "$GITHUB_OUTPUT"
          exit "$status"

      # The LilyPond SVG render, timed on its own so the budget can exclude it
      # (a fixed external cost). PATH points at the install from the gated step
      # above; on a cache hit LilyPond is absent and --skip-if-missing carries
      # the build on the restored SVGs (~0s).
      - name: Render SVGs
        id: render
        run: |
          export PATH="$HOME/.local/lilypond/lilypond-2.26.0/bin:$PATH"
          start=$(date +%s)
          status=0
          node build/buildScores.mjs --skip-if-missing || status=$?
          end=$(date +%s)
          echo "duration=$((end - start))" >> "$GITHUB_OUTPUT"
          exit "$status"

      # The vite bundle, timed separately — it counts toward the budget (a vite
      # regression should trip it). `npx vite build` runs the bundle WITHOUT
      # re-triggering `prebuild` (ohm already built by `check`, SVGs by `render`),
      # so the render does not run twice.
      - name: Bundle
        id: bundle
        run: |
          start=$(date +%s)
          status=0
          npx vite build || status=$?
          end=$(date +%s)
          echo "duration=$((end - start))" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Run unit tests
        id: unit-tests
        run: |
          start=$(date +%s)
          status=0
          npm run test:unit || status=$?
          end=$(date +%s)
          echo "duration=$((end - start))" >> "$GITHUB_OUTPUT"
          exit "$status"

      # if: always() runs the report even when an upstream phase failed. Budgets
      # are SOFT — a breach warns but does NOT fail the job. The SVG render is
      # reported but EXCLUDED from the pass/fail total (a fixed external cost,
      # ~0s on a cache hit); the budgeted total guards check + bundle + unit. The
      # logic lives in the unit-tested build/ciDurationReport.mjs
      # (src/test/ciDurationReport.test.ts). See doc/CI.md "Duration Budget".
      - name: Report CI duration budget
        if: always()
        env:
          CHECK_S: ${{ steps.check.outputs.duration }}
          RENDER_S: ${{ steps.render.outputs.duration }}
          BUNDLE_S: ${{ steps.bundle.outputs.duration }}
          UNIT_S: ${{ steps.unit-tests.outputs.duration }}
          UNIT_BUDGET_SEC: 120
          TOTAL_BUDGET_SEC: 360
        run: node build/ciDurationReport.mjs

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # paths-filter falls back to the GitHub API to list a PR's changed files
    # (the checkout is shallow), which needs pull-requests:read. With a
    # restrictive default token (e.g. after the repo was made private) that
    # call fails with "Resource not accessible by integration", skipping the
    # tests and reddening the job. Grant the read scopes explicitly.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            build-related:
              - "build/**"
              - "src/lilypond/**"
              - "src/test/integration/**"
              - "package.json"
              - "package-lock.json"
              - "vite.config.ts"
              - "tsconfig.json"
              - ".nvmrc"
              - ".github/workflows/ci.yml"

      - name: Check if integration tests should run
        id: should-run
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.filter.outputs.build-related }}" == "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - uses: actions/setup-node@v6
        if: steps.should-run.outputs.run == 'true'
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci
        if: steps.should-run.outputs.run == 'true'

      - name: Run integration tests
        run: npm run test:integration
        if: steps.should-run.outputs.run == 'true'

      - name: Report skip when no build-related changes
        if: steps.should-run.outputs.run != 'true'
        run: |
          msg="Integration tests skipped — should-run='${{ steps.should-run.outputs.run }}' (PR did not touch build-related paths)."
          echo "$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
