name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "lilypond/src/**"
      - "lilypond/build/**"
      - ".github/monitor-series.json"
      - ".github/scripts/monitor-resources.mjs"
      - ".github/scripts/monitor-resources.test.mjs"
      - ".github/workflows/lilypond.yml"
      - ".github/workflows/e2e.yml"
      - ".github/workflows/monitor-resources.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "lilypond/src/**"
      - "lilypond/build/**"
      - ".github/monitor-series.json"
      - ".github/scripts/monitor-resources.mjs"
      - ".github/scripts/monitor-resources.test.mjs"
      - ".github/workflows/lilypond.yml"
      - ".github/workflows/e2e.yml"
      - ".github/workflows/monitor-resources.yml"
  # Daily at 00:00 UTC — catches drift in the test suite on days when no PR
  # triggered the job. GitHub may delay scheduled runs by up to ~15 min during
  # peak load.
  schedule:
    - cron: "0 0 * * *"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.check.outputs.app }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine if application-relevant files changed
        id: check
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "origin/${{ github.base_ref }}" HEAD | grep -qvE '^([^/]*\.md$|lilypond/src/|lilypond/build/|\.github/monitor-series\.json$|\.github/scripts/monitor-resources\.mjs$|\.github/scripts/monitor-resources\.test\.mjs$|\.github/workflows/lilypond\.yml$|\.github/workflows/e2e\.yml$|\.github/workflows/monitor-resources\.yml$)'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm ci

      - name: Run checks and build
        run: pnpm run check && pnpm run build

      - name: Run unit tests
        run: pnpm run test:unit

  test-noop:
    needs: changes
    if: ${{ needs.changes.outputs.app != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: No application-relevant files changed
        run: echo "Skipping CI — changed files are in ci.yml's paths-ignore list."
