name: PWA CI

on:
  push:
    branches: [main]
    paths:
      - "packages/pwa/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".nvmrc"
      - ".github/workflows/pwa-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/pwa/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".nvmrc"
      - ".github/workflows/pwa-ci.yml"
  # Nightly schedule disabled — see request from wainwmr, 2026-09-29.
  # schedule:
  #   - cron: "0 0 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm ci

      - name: Run checks and build
        run: pnpm run check && pnpm run build

      - name: Run unit tests
        run: pnpm run test:unit
