name: Monitor CI

on:
  push:
    branches: [main]
    paths:
      - "packages/monitor/**"
      - ".github/workflows/monitor-ci.yml"
      # notify-workflow-failure.test.mjs asserts cross-file contracts against
      # these two, so an edit to either must re-run the guard (#726).
      - ".github/workflows/pwa-e2e-notify.yml"
      - ".github/workflows/pwa-e2e.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/monitor/**"
      - ".github/workflows/monitor-ci.yml"
      # notify-workflow-failure.test.mjs asserts cross-file contracts against
      # these two, so an edit to either must re-run the guard (#726).
      - ".github/workflows/pwa-e2e-notify.yml"
      - ".github/workflows/pwa-e2e.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --filter @spem/monitor
      - run: pnpm --filter @spem/monitor test
