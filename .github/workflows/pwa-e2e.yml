# LOAD-BEARING NAME. pwa-e2e-notify.yml watches this workflow by matching this
# exact `name:` string (workflow_run matches the name, not the filename), and
# GitHub never validates that: rename it and the failure alert silently stops
# firing forever, with no error anywhere (#726).
# packages/monitor/notify-workflow-failure.test.mjs asserts the two agree.
name: PWA E2E

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm ci
      - run: pnpm run build
      - run: pnpm --filter @spem/pwa exec playwright install --with-deps
      - run: pnpm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: packages/pwa/playwright-report/
          retention-days: 7
