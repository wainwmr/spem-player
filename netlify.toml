# Netlify configuration for spem-player
#
# Build: npm run build (prebuild + vite build). SVGs are committed to git
# (#461) so LilyPond is not needed on Netlify.
#
# Ignore: skip the build when none of the listed paths changed. Exits 0
# (skip) if no differences; exits 1 (build) if any path changed.
# src/lilypond/ is intentionally excluded — .ly changes trigger the
# LilyPond workflow (#462) which commits updated SVGs, and the SVG commit
# then triggers Netlify.
[build]
  command = "npm run build"
  publish = "dist"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src/ts src/scss src/ohmjs src/scores public index.html vite.config.ts package.json package-lock.json netlify.toml"
  functions = "netlify/functions"

  ## Uncomment to use this redirect for Single Page Applications like create-react-app.
  ## Not needed for static site generators.
  #[[redirects]]
  #  from = "/*"
  #  to = "/index.html"
  #  status = 200

  ## (optional) Settings for Netlify Dev
  ## https://github.com/netlify/cli/blob/main/docs/netlify-dev.md#project-detection
  #[dev]
  #  command = "yarn start" # Command to start your dev server
  #  port = 3000 # Port that the dev server will be listening on
  #  publish = "dist" # Folder with the static content for _redirect file

  ## more info on configuring this file: https://ntl.fyi/file-based-config
