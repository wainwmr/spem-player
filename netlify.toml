# Netlify configuration for spem-player

# Build:
#   A local Netlify build plugin (plugins/cache-scores) caches the generated
#   SVGs across deploys, keyed on build/scoreCacheKey.mjs (#421's hashed inputs).
#   On a cache HIT it writes a .netlify-scores-hit flag and the build command
#   below skips the LilyPond install + regeneration — buildScores.mjs's
#   --skip-if-missing canary path carries the build on the restored SVGs. On a
#   MISS the command installs LilyPond and regenerates (#423). The plugin is
#   fail-safe: any cache error degrades to the full install + build path.
#
#   Miss-path notes (unchanged from #318): install-lilypond.sh downloads
#   LilyPond (or no-ops if cached); PATH is re-exported because the script's
#   export does not propagate across `&&` (2.26.0 must stay in sync with
#   LILYPOND_VERSION in build/install-lilypond.sh); `lilypond --version` is a
#   presence probe to catch a silent install regression (PR #271 shipped empty
#   scores). npm run build runs prebuild (regenerate from src/lilypond/) + vite.
[[plugins]]
  package = "./plugins/cache-scores"

[build]
  command = '''
    if [ -f .netlify-scores-hit ]; then
      echo "cache-scores: hit — skipping LilyPond install + regeneration"
      npm run build
    else
      bash build/install-lilypond.sh \
        && export PATH="$HOME/.local/lilypond/lilypond-2.26.0/bin:$PATH" \
        && lilypond --version \
        && npm run build
    fi
  '''
  functions = "netlify/functions"
  publish = "dist"

  ## Uncomment to use this redirect for Single Page Applications like create-react-app.
  ## Not needed for static site generators.
  #[[redirects]]
  #  from = "/*"
  #  to = "/index.html"
  #  status = 200

  ## (optional) Settings for Netlify Dev
  ## https://github.com/netlify/cli/blob/main/docs/netlify-dev.md#project-detection
  #[dev]
  #  command = "yarn start" # Command to start your dev server
  #  port = 3000 # Port that the dev server will be listening on
  #  publish = "dist" # Folder with the static content for _redirect file

  ## more info on configuring this file: https://ntl.fyi/file-based-build-config
