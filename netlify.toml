# Netlify configuration for spem-player

# Build command:
#   1. install-lilypond.sh downloads LilyPond into $HOME/.local/lilypond
#      (or no-ops if it's cached / already on PATH).
#   2. We re-export PATH because the script's PATH export does not propagate
#      across the `&&` chain. The 2.26.0 here must stay in sync with
#      LILYPOND_VERSION in build/install-lilypond.sh.
#   3. `lilypond --version` is a fail-loud probe before `npm run build`
#      to catch any silent install regression (ticket #318 — the previous
#      attempt PR #271 was reverted because Netlify shipped empty scores).
#   4. npm run build invokes prebuild (regenerates SVGs from src/lilypond/)
#      then vite build.
[build]
  command = "bash build/install-lilypond.sh && export PATH=\"$HOME/.local/lilypond/lilypond-2.26.0/bin:$PATH\" && lilypond --version && npm run build"
  functions = "netlify/functions"
  publish = "dist"

  ## Uncomment to use this redirect for Single Page Applications like create-react-app.
  ## Not needed for static site generators.
  #[[redirects]]
  #  from = "/*"
  #  to = "/index.html"
  #  status = 200

  ## (optional) Settings for Netlify Dev
  ## https://github.com/netlify/cli/blob/main/docs/netlify-dev.md#project-detection
  #[dev]
  #  command = "yarn start" # Command to start your dev server
  #  port = 3000 # Port that the dev server will be listening on
  #  publish = "dist" # Folder with the static content for _redirect file

  ## more info on configuring this file: https://ntl.fyi/file-based-build-config
